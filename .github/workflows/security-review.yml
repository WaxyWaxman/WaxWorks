name: security-review

# Model-backed security review of code entering staging (A-92, docs/architecture.md
# §2.7). Advisory by decision: findings land as inline pull-request comments and a
# JSON artifact, and the coordinator carries them into the work order's Findings
# table for the architect gate (docs/build/workflow.md §3 gate 3). This job never
# fails the check; a human merges. The docs-check workflow stays deterministic and
# keyless -- this is the only workflow that may read ANTHROPIC_API_KEY.
#
# The action is not hardened against prompt injection, so the repository setting
# "Require approval for all outside collaborators" must stay on.

on:
  pull_request:
    branches: [staging]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: security-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scan:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2

      # Pinned to a commit, never a moving ref. main tip as of 2026-02-11.
      # Bump deliberately, in its own pull request, after reading the diff.
      - id: review
        uses: anthropics/claude-code-security-review@0c6a49f1fa56a1d472575da86a94dbc1edb78eda
        continue-on-error: true # advisory (A-92); the finding blocks at gate 3, not here
        with:
          claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude-model: claude-opus-5
          comment-pr: true
          upload-results: true
          claudecode-timeout: 20
          exclude-directories: docs,design
          custom-security-scan-instructions: .github/security-review/scan-instructions.txt
          false-positive-filtering-instructions: .github/security-review/false-positives.txt

      - name: Summary
        if: always()
        run: |
          echo "Security review findings: ${{ steps.review.outputs.findings-count || 'n/a' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Advisory (A-92): carry each comment into the work order's Findings table; a human merges." >> "$GITHUB_STEP_SUMMARY"
