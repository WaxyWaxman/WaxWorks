name: build-check

# A-97: CI runs six jobs, wired at M0, and a suite with nothing to run passes
# rather than being absent. Jobs 1 and 2 (check_docs, check_coverage) are in
# docs-check.yml; this file is jobs 3–6. Playwright is a seventh job and is NOT
# here — it lands with the first /qa automate and gates a register row, not a
# work order. The pgTAP job also carries A-98's db-types regeneration check,
# because it is the job that has a database.
#
# Keyless: no secret is read here. The local Supabase's development keys are the
# toolchain's fixed public ones (A-100).

on:
  pull_request:
  push:
    branches: [main, staging]

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 11.0.9
  NODE_VERSION: 24

jobs:
  typecheck:
    name: "3 typecheck"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  lint:
    name: "4 lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  vitest:
    name: "5 vitest"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # tests/ reads git ls-files
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Members' suites (e2e excluded — it is Playwright's), then the repository checks under tests/.
      - run: pnpm test

  pgtap:
    name: "6 pgTAP"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      # The database and API only — the same exclusion a developer uses locally (A-10).
      - name: Start local Supabase (migrations + seed = db reset from a clean checkout)
        run: supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector,realtime,storage-api,mailpit,supavisor
      - name: pgTAP
        run: supabase test db
      # A-98: db-types is regenerated by D in the same pull request as the migration; CI fails on a diff.
      - name: db-types is current
        run: |
          pnpm --filter @waxworks/db-types gen
          git diff --exit-code -- packages/db-types/index.ts || {
            echo "::error::packages/db-types/index.ts is stale — run 'pnpm --filter @waxworks/db-types gen' with local Supabase running and commit it (A-98)"; exit 1; }
      - if: always()
        run: supabase stop --no-backup
