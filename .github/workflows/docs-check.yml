name: docs-check

# Mechanical consistency gate for the specification documents. Deterministic --
# this workflow reads no API key and runs no model. The judgement calls stay with
# /spec-audit, which a human runs locally before opening the PR. The one
# model-backed check in CI is security-review.yml, on pull requests into staging
# (A-96); it is advisory and reads the only secret CI holds.

on:
  # No paths filter: a change under .claude/ can break a cross-link too, and the
  # job takes seconds. GitHub runs this against refs/pull/N/merge -- the simulated
  # merge with main's tip -- so it validates the merged result, not the branch head.
  pull_request:
  push:
    branches: [main, staging]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check specification consistency
        run: python scripts/check_docs.py
      - name: Decision-to-test coverage (report; the build gate is --order, run per work order)
        run: python scripts/check_coverage.py
